name: Metrics

on:
  # Refresh every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Manual trigger from the Actions tab
  workflow_dispatch:
  # Regenerate on push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Overall stats: activity, community, repos, languages
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          template: classic
          # Parked: community (followers/sponsors) and metadata (generator footer)
          # carry no signal about the code.
          # base: header, activity, community, repositories, metadata
          base: header, activity, repositories
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

      # Full-year isometric calendar of daily contributions
      - name: Isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

