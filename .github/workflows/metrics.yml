name: Metrics

on:
  # Refresh every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Manual trigger from the Actions tab
  workflow_dispatch:
  # Regenerate on push to main
  push:
    branches:
      - main

permissions:
  contents: write

# Pushes a minute apart used to start overlapping runs. Each run reads the
# metrics.svg sha when it starts and commits against it minutes later, so the
# slower run failed with "metrics.svg does not match <sha>" and retried until
# the job timed out. A newer run now cancels the older one, whose render would
# be superseded anyway.
concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Open-source footprint: what was raised, what landed, and where.
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          template: classic
          # Parked: `community` was followers/sponsors, `metadata` the generator
          # footer, and `repositories` a wall of repo counts, licenses, releases,
          # packages and disk usage. None of it speaks to open-source work.
          # base: header, activity, community, repositories, metadata
          base: header, activity
          config_timezone: Asia/Kolkata

          # Pull requests and issues raised, and how many of them were merged
          # or closed. `user` scopes this to work created across GitHub rather
          # than to activity on own repositories.
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_followup_indepth: yes
          plugin_followup_archived: no

          # Parked: this renders "Unexpected error". The plugin asks for every
          # repository contributed to in one GraphQL query, and that list includes
          # `Alignerr-Code-Labeling`, an org that rejects classic PATs with a
          # lifetime over 184 days. One forbidden repo fails the whole query, and
          # plugin_notable_skipped cannot help because it filters after the fetch.
          # Re-enable after reissuing METRICS_TOKEN with a lifetime under 184 days.
          # plugin_notable: yes
          # plugin_notable_from: all
          # plugin_notable_types: commit, pull_request
          # plugin_notable_repositories: yes

          plugin_languages: yes
          # Parked: byte sizes were noise alongside the percentages.
          # plugin_languages_details: bytes-size, percentage
          plugin_languages_details: percentage
          plugin_languages_limit: 6

      # Full-year isometric calendar of daily contributions
      - name: Isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  # Contribution mix radar (commits / issues / PRs / code review).
  # Runs after `metrics` so the checkout already has that job's commits.
  radar:
    needs: metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Render contribution radar
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          RADAR_WINDOW: year
        run: node scripts/contribution-radar.mjs

      - name: Commit if the numbers moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contribution-radar.svg
          if git diff --quiet --cached; then
            echo "Radar unchanged, nothing to commit."
          else
            git commit -m "chore: refresh contribution radar [Skip GitHub Action]"
            git pull --rebase origin main
            git push
          fi
